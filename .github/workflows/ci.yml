name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / HEMTT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
        with:
          annotate: true

      - name: Validate repository
        run: python -B tools/validate_repository.py

      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: HEMTT check
        run: hemtt check

      - name: HEMTT build without binarization
        run: hemtt build --no-bin

      - name: Upload Linux build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-linux
          path: .hemttout/build/**
          include-hidden-files: true
          if-no-files-found: error

  windows:
    name: Windows / HEMTT
    runs-on: windows-latest
    env:
      ARMA3_TOOLS_URL: ${{ secrets.ARMA3_TOOLS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
        with:
          annotate: true

      - name: Set up Arma 3 Tools
        if: env.ARMA3_TOOLS_URL != ''
        uses: arma-actions/arma3-tools@7a1666b84a58503702f56319d8ffa975ec8a463e # master 2025-02-04
        with:
          toolsUrl: ${{ secrets.ARMA3_TOOLS_URL }}

      - name: Validate repository
        run: python -B tools/validate_repository.py

      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: HEMTT check
        run: hemtt check

      - name: HEMTT build
        if: env.ARMA3_TOOLS_URL != ''
        run: hemtt build

      - name: HEMTT build without binarization
        if: env.ARMA3_TOOLS_URL == ''
        run: hemtt build --no-bin

      - name: Upload Windows build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-windows
          path: .hemttout/build/**
          include-hidden-files: true
          if-no-files-found: error

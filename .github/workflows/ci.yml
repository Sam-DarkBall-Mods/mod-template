name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / HEMTT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          annotate: true
          version: "v1.21.0"

      - name: Validate repository
        run: python -B tools/validate_repository.py

      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: HEMTT check
        run: hemtt check

      - name: HEMTT build without binarization
        run: hemtt build --no-bin

      - name: Upload Linux build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-linux
          path: .hemttout/build/**
          include-hidden-files: true
          if-no-files-found: error

  windows:
    name: Windows / HEMTT
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          annotate: true
          version: "v1.21.0"

      - name: Set up Arma 3 Tools
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BUILD_ASSETS_TOKEN }}
        run: ./tools/setup_arma3_tools.ps1

      - name: Validate repository
        run: python -B tools/validate_repository.py

      - name: Run tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate release scripts
        shell: pwsh
        run: |
          Get-ChildItem tools -Filter *.py | ForEach-Object {
              python -m py_compile $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Invalid Python: $($_.Name)" }
          }

          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error $_.Message }
                  throw "Invalid PowerShell: $($_.Name)"
              }
          }

      - name: HEMTT check
        run: hemtt check

      - name: HEMTT build
        if: github.event_name != 'pull_request'
        run: hemtt build

      - name: HEMTT build without binarization
        if: github.event_name == 'pull_request'
        run: hemtt build --no-bin

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-windows
          path: .hemttout/build/**
          include-hidden-files: true
          if-no-files-found: error
